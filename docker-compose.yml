version: '3.8'

services:
  mariadb:
    image: mariadb:11
    container_name: selfcloud-mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-selfcloud}
      MYSQL_USER: ${DB_USER:-selfcloud}
      MYSQL_PASSWORD: ${DB_PASSWORD:-selfcloud_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ${DB_DATA_DIR:-mariadb_data}:/var/lib/mysql

  selfcloud:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: selfcloud-backend
    restart: always
    environment:
      SERVER_PORT: "8080"
      DB_DRIVER: "mysql"
      DB_DSN: "${DB_USER:-selfcloud}:${DB_PASSWORD:-selfcloud_pass}@tcp(mariadb:3306)/${DB_NAME:-selfcloud}?parseTime=true"
      STORAGE_DIR: "/var/lib/selfcloud/data"
      SERVE_STATIC: "false"
      AUTO_MIGRATE: "${AUTO_MIGRATE:-true}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      SSO_GOOGLE_CLIENT_ID: "${SSO_GOOGLE_CLIENT_ID:-}"
      SSO_GOOGLE_CLIENT_SECRET: "${SSO_GOOGLE_CLIENT_SECRET:-}"
      SSO_REDIRECT_BASE_URL: "${SSO_REDIRECT_BASE_URL:-http://localhost:8080}"
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ${DATA_DIR:-./data}:/var/lib/selfcloud/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: selfcloud-web
    restart: always
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - selfcloud

volumes:
  mariadb_data:
