server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Performance & WebDAV Large File Upload Settings
    client_max_body_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;
    proxy_buffering off;

    # Gzip Compression for static UI assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Forward incoming X-Forwarded-Proto from outer reverse proxy (e.g. host Nginx / SSL terminator)
    set $forwarded_proto $scheme;
    if ($http_x_forwarded_proto != "") {
        set $forwarded_proto $http_x_forwarded_proto;
    }

    # Go Backend WebDAV & REST API Proxy
    location ~ ^/(api|remote\.php|ocs|status\.php|metrics|dav|webdav)(/|$) {
        proxy_pass http://selfcloud-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Public Share Downloads -> Proxy to Go Backend
    location ~ ^/s/.+/download$ {
        proxy_pass http://selfcloud-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Static Web UI Single Page Application Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
